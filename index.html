<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Digital Dictionary</title>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
    <h1>The Digital Dictionary</h1>
    <p><em>Your interactive reference tool.</em></p>
    </header>

    <section>
            <label for="word-input">Search Word:</label>
            <input type="text" id="word-input" placeholder="Type a word (e.g., hello)">
            <button type="button" id="search-btn">Search</button>        
    </section>

    <h2></h2>

    <section id="result-container">
        <p>Search for a word above to see it's definition!</p>
    </section>


</body>
</html>
